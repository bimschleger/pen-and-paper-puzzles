; PlatformIO Project Configuration File
; Pen and Paper Puzzles - ESP32 80mm Thermal Receipt Printer Client

[platformio]
default_envs = esp32s3
src_dir = src
include_dir = include

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -I include
board_build.partitions = huge_app.csv
lib_deps =
    arduino-libraries/Ethernet @ ^2.0.2

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32dev]
board = esp32dev
